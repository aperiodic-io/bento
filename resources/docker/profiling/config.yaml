http:
  address: 0.0.0.0:4195
  debug_endpoints: true

input:
  generate:
    interval: "1s"
    mapping: |
      root.id = uuid_v4()
      root.bar = [] # [ "foo", "bar" ]

output:
  drop: {}

metrics:
  prometheus:
    push_interval: 1s
    push_job_name: bento_push
    push_url: "http://localhost:9091"
