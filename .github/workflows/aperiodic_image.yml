name: Aperiodic Image

on:
  push:
    branches: [main, 'perf/**']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'aperiodic-io/bento'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-')"
          echo "tags=ghcr.io/${{ github.repository_owner }}/bento:${GITHUB_SHA::10},ghcr.io/${{ github.repository_owner }}/bento:${branch}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./resources/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
